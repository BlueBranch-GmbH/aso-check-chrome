<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style>
  @font-face { font-family: "Gilroy ExtraBold"; src: url("../fonts/Gilroy-ExtraBold.woff2"); font-weight: 800; }
  @font-face { font-family: "Titillium Web"; src: url("../fonts/titillium-web-latin-400-normal.woff2"); font-weight: 400; }
  @font-face { font-family: "Titillium Web"; src: url("../fonts/titillium-web-latin-700-normal.woff2"); font-weight: 700; }
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
  body {
    display: grid; grid-template-columns: 1fr 420px; align-items: center; gap: 72px;
    padding: 0 96px; box-sizing: border-box; color: #fff; font-family: "Titillium Web", Arial, sans-serif;
    background: radial-gradient(900px 600px at 78% 50%, rgba(29, 78, 216, .45), transparent 70%), #0f1b3d;
  }
  .logo { display: block; height: 34px; margin-bottom: 44px; }
  .eyebrow { margin: 0 0 16px; font-size: 18px; font-weight: 700; letter-spacing: .08em; color: rgba(255,255,255,.75); }
  h1 { margin: 0 0 30px; font: 800 56px/1.08 "Gilroy ExtraBold", sans-serif; }
  .hl { box-shadow: inset 0 -0.18em 0 #3df799; white-space: nowrap; }
  ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; font-size: 22px; color: #e2e8f0; }
  li { display: flex; gap: 14px; align-items: baseline; }
  li::before { content: ""; flex: none; width: 10px; height: 10px; border-radius: 50%; background: #3df799; transform: translateY(-2px); }
  .popup { height: 690px; border-radius: 18px; overflow: hidden; background: #fff;
           box-shadow: 0 40px 90px rgba(5, 11, 43, .6), 0 0 0 1px rgba(255,255,255,.08); }
  .popup img { display: block; width: 100%; }
</style></head><body>
  <div>
    <img class="logo" src="../brand/logo-white.svg" alt="BlueBranch">
    <p class="eyebrow">KOSTENLOSER ASO-CHECK</p>
    <h1>Wie gut ist dein <span class="hl">Store-Eintrag?</span></h1>
    <ul>
      <li>Score für App Store &amp; Google Play</li>
      <li>App-Name, Untertitel und Beschreibung im Check</li>
      <li>Ein Klick direkt auf der Store-Seite</li>
      <li>Detaillierter Bericht kostenlos per Mail</li>
    </ul>
  </div>
  <div class="popup"><img src="popup-result.png" alt=""></div>
</body></html>
