<!doctype html>
<html lang="de"><head><meta charset="utf-8"><style>
  @font-face { font-family: "Plus Jakarta Sans"; src: url("../fonts/plus-jakarta-sans-latin-800-normal.woff2"); font-weight: 800; }
  @font-face { font-family: "IBM Plex Sans"; src: url("../fonts/ibm-plex-sans-latin-400-normal.woff2"); font-weight: 400; }
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
  body { display: grid; grid-template-columns: 1fr 420px; align-items: center; gap: 64px; padding: 0 96px;
         box-sizing: border-box; background: #1c1133; color: #fff; font-family: "IBM Plex Sans", sans-serif; }
  .kicker { margin: 0 0 18px; color: #44e293; font-size: 20px; letter-spacing: .08em; text-transform: uppercase; }
  h1 { margin: 0 0 24px; font: 800 58px/1.08 "Plus Jakarta Sans", sans-serif; }
  h1 span { color: #44e293; }
  ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; font-size: 22px; color: #e8e6ef; }
  li::before { content: "✓"; margin-right: 12px; color: #44e293; font-weight: 800; }
  .popup { width: 420px; border-radius: 18px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.45); background: #fff; }
  .popup { height: 690px; } .popup img { display: block; width: 100%; }
</style></head><body>
  <div>
    <p class="kicker">App Marketing Hub</p>
    <h1>Wie gut ist dein <span>Store-Eintrag?</span></h1>
    <ul>
      <li>ASO-Score für App Store &amp; Google Play</li>
      <li>App-Name, Untertitel &amp; Beschreibung im Check</li>
      <li>Ein Klick direkt auf der Store-Seite</li>
      <li>Detaillierter Bericht kostenlos per Mail</li>
    </ul>
  </div>
  <div class="popup"><img src="popup-result.png" alt=""></div>
</body></html>
